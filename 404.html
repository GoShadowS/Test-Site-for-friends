<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — страница не найдена · DemoVerse</title>
  <meta name="description" content="Страница не найдена. Но зато здесь есть пасхалка!">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nf-wrap { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 40px 20px; }
    .nf-code {
      font-size: clamp(5rem, 18vw, 10rem); font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, #7c3aed, #06b6d4, #f472b6);
      background-size: 200% 200%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: nfShift 5s ease infinite;
    }
    @keyframes nfShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .nf-ghost { font-size: 5rem; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" id="brandLogo">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg)"/><path d="M10 8h6a8 8 0 0 1 0 16h-6V8zm4 3.6v8.8h2a4.4 4.4 0 0 0 0-8.8h-2z" fill="#fff"/></svg>
        DemoVerse
      </a>
      <nav class="nav" id="nav">
        <a href="index.html">🏠 Главная</a>
        <a href="games.html">🎮 Игры</a>
        <a href="apps.html">🧰 Приложения</a>
        <a href="blog.html">📰 Блог</a>
        <a href="faq.html">❔ FAQ</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" title="Переключить тему">🌙</button>
        <button class="icon-btn burger" id="burger" aria-label="Открыть меню">☰</button>
      </div>
    </div>
  </header>

  <main class="nf-wrap">
    <div class="center">
      <div class="nf-ghost anim-float">👻</div>
      <div class="nf-code">404</div>
      <h1 style="font-size:1.5rem; margin-bottom:10px">Такой страницы нет… пока!</h1>
      <p class="muted" style="max-width:440px; margin:0 auto 26px">Возможно, её съела змейка с <a href="games.html">страницы игр</a>, или вы просто опечатались. Бывает и такое.</p>
      <div class="flex gap-14" style="justify-content:center; flex-wrap:wrap">
        <a href="index.html" class="btn btn-primary">🏠 На главную</a>
        <a href="games.html" class="btn btn-secondary">🎮 Уйти играть</a>
        <button class="btn btn-ghost" id="nfEgg">🥚 Ммм, что это?</button>
      </div>
    </div>
  </main>

  <script src="js/main.js" defer></script>
  <script defer>
    document.getElementById("nfEgg")?.addEventListener("click", () => {
      const answers = [
        "Здесь ничего нет. Честно. Но вы всё равно нажмите ещё раз 👀",
        "Я сказал — ничего! Ладно… попробуйте код Konami на главной ↑↑↓↓←→←→BA",
        "Вы упорный! Это качество пригодится в квизе: quiz.html 😏",
        "Окей-окей: секрет в том, что на 5 кликов по логотипу в шапке есть достижение 🏆",
        "Всё, пасхалки кончились! Возвращайтесь на главную 💜"
      ];
      window.nfClicks = (window.nfClicks || 0) + 1;
      toast(answers[Math.min(window.nfClicks - 1, answers.length - 1)], "info", 4200);
    });
    console.log("%c👻 404: привет из консоли! Попробуй ввести hereIAm()", "color:#06b6d4; font-size:14px; font-weight:bold");
    window.hereIAm = () => { toast("Вы нашли консольную пасхалку! Вы официально разработчик 🤓", "success"); unlockAchievement("konami"); };
  </script>
</body>
</html>
